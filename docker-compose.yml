# Bayora Hardened Architecture - Phase 3 Five-Zone Network Segmentation
# Enforces:
# 1. Three internal isolated networks (red-net, blue-net, model-net) with internal: true
# 2. Host-facing network (gateway-host-net) with published port 127.0.0.1:8000:8000 strictly for Gateway
# 3. Gateway (bayora-baseline-stub) is the SOLE multi-homed container across internal trust zones
# 4. Strict static IPAM addresses for all containers; deterministic addressing prevents IP drift
# 5. Red extra_hosts restricted strictly to baseline-stub (172.20.1.2)
# 6. Blue and Model ports (8001, 8080) NOT published to host
# 7. All Phase 2 controls preserved: gVisor (runsc) on Red, seccomp/AppArmor on Model, cap_drop: ALL, read-only rootfs

services:
  model-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: bayora-model-server
    command:
      - "-m"
      - "/models/model.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "2048"
      - "-t"
      - "2"
      - "--cache-prompt"
    volumes:
      - ./models/qwen2.5-1.5b-instruct-q4_k_m.gguf:/models/model.gguf:ro
    security_opt:
      - seccomp:./policies/seccomp/model-server-seccomp.json
      - apparmor:bayora-model-server
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      model-net:
        ipv4_address: 172.20.3.20
    restart: unless-stopped

  blue-filter:
    build:
      context: ./services/blue-filter
      dockerfile: Dockerfile
    container_name: bayora-blue-filter
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,noexec,nosuid
    environment:
      - BLUE_RULES_PATH=/app/blue_rules.json
    security_opt:
      - seccomp:./policies/seccomp/python-service-seccomp.json
      - apparmor:bayora-python-service
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      blue-net:
        ipv4_address: 172.20.2.10
    restart: unless-stopped

  baseline-stub:
    build:
      context: ./services/baseline-stub
      dockerfile: Dockerfile
    container_name: bayora-baseline-stub
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,noexec,nosuid
    environment:
      - BLUE_FILTER_URL=http://blue-filter:8001
      - MODEL_SERVER_URL=http://model-server:8080
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - seccomp:./policies/seccomp/python-service-seccomp.json
      - apparmor:bayora-python-service
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - "blue-filter:172.20.2.10"
      - "model-server:172.20.3.20"
    depends_on:
      - blue-filter
      - model-server
    networks:
      gateway-host-net:
        ipv4_address: 172.20.0.2
      red-net:
        ipv4_address: 172.20.1.2
      blue-net:
        ipv4_address: 172.20.2.2
      model-net:
        ipv4_address: 172.20.3.2
    restart: unless-stopped

  red-runner:
    runtime: runsc
    build:
      context: ./services/red-runner
      dockerfile: Dockerfile
    container_name: bayora-red-runner
    command: ["tail", "-f", "/dev/null"]
    environment:
      - GATEWAY_URL=http://baseline-stub:8000
      - PAYLOADS_PATH=/app/data/payloads.json
      - OUTPUT_DIR=/app/results
    volumes:
      - ./data/baseline/payloads.json:/app/data/payloads.json:ro
    tmpfs:
      - /app/results:rw,size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - baseline-stub
    extra_hosts:
      - "baseline-stub:172.20.1.2"
    networks:
      red-net:
        ipv4_address: 172.20.1.10
    restart: unless-stopped

networks:
  red-net:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.20.1.0/24

  blue-net:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.20.2.0/24

  model-net:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.20.3.0/24

  gateway-host-net:
    driver: bridge
    internal: false
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
