# Bayora Insecure Baseline - Docker Compose (Phase 1 / Hardening Phase 2)
# Hardened in Phase 2:
# 1. Red isolated under gVisor (runsc)
# 2. Seccomp and AppArmor enforcing profiles on services
# 3. Linux capabilities dropped (cap_drop: ALL) and no-new-privileges: true
# 4. Shared volume removed; Red given payloads-only read-only mount and tmpfs results (no host write)
# 5. Blue filter and Gateway run as non-root (65534:65534) with read-only rootfs and tmpfs /tmp
# 6. Host published ports strictly bound to 127.0.0.1 (localhost)

services:
  model-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: bayora-model-server
    command:
      - "-m"
      - "/models/model.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "2048"
      - "-t"
      - "2"
      - "--cache-prompt"
    volumes:
      - ./models/qwen2.5-1.5b-instruct-q4_k_m.gguf:/models/model.gguf:ro
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - seccomp:./policies/seccomp/model-server-seccomp.json
      - apparmor:bayora-model-server
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - baseline-net
    restart: unless-stopped

  blue-filter:
    build:
      context: ./services/blue-filter
      dockerfile: Dockerfile
    container_name: bayora-blue-filter
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,noexec,nosuid
    environment:
      - BLUE_RULES_PATH=/app/blue_rules.json
    ports:
      - "127.0.0.1:8001:8001"
    security_opt:
      - seccomp:./policies/seccomp/python-service-seccomp.json
      - apparmor:bayora-python-service
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - baseline-net
    restart: unless-stopped

  baseline-stub:
    build:
      context: ./services/baseline-stub
      dockerfile: Dockerfile
    container_name: bayora-baseline-stub
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,noexec,nosuid
    environment:
      - BLUE_FILTER_URL=http://blue-filter:8001
      - MODEL_SERVER_URL=http://model-server:8080
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - seccomp:./policies/seccomp/python-service-seccomp.json
      - apparmor:bayora-python-service
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - blue-filter
      - model-server
    networks:
      - baseline-net
    restart: unless-stopped

  red-runner:
    runtime: runsc
    build:
      context: ./services/red-runner
      dockerfile: Dockerfile
    container_name: bayora-red-runner
    command: ["tail", "-f", "/dev/null"]
    environment:
      - GATEWAY_URL=http://baseline-stub:8000
      - PAYLOADS_PATH=/app/data/payloads.json
      - OUTPUT_DIR=/app/results
    volumes:
      - ./data/baseline/payloads.json:/app/data/payloads.json:ro
    tmpfs:
      - /app/results:rw,size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - baseline-stub
    extra_hosts:
      - "model-server:172.18.0.3"
      - "blue-filter:172.18.0.2"
      - "baseline-stub:172.18.0.4"
    networks:
      - baseline-net
    restart: unless-stopped

networks:
  baseline-net:
    driver: bridge
